<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PoolApp · Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif}
.field{position:relative}
.field input{width:100%;height:52px;border-radius:12px;border:1px solid #d1d5db;background:#f9fafb;padding:0 44px 0 42px;font-size:14.5px;font-weight:500;color:#111827;outline:none;transition:.2s}
.field input:focus{background:#fff;border-color:#0F5C5C;box-shadow:0 0 0 3px rgba(15,92,92,.12)}
.icon-left{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#6b7280}
.eyeBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;color:#6b7280}
.eyeBtn:hover{background:#f3f4f6;color:#111827}
.eyeBtn svg{width:18px;height:18px}
.btn{width:100%;height:52px;border-radius:12px;background:#0F5C5C;color:#fff;font-weight:700;font-size:15px;transition:.2s}
.btn:hover{background:#0A3D3D}.btn:disabled{opacity:.6}
</style>
</head>
<body class="bg-[#f3f5f5]">

<div id="viewLogin" class="min-h-screen grid place-items-center p-4">
<div class="w-full max-w-[380px]">
<div class="bg-white rounded-[20px] border border-gray-200 p-7 shadow-sm">
<div class="mb-6">
<h1 class="text-[18px] font-bold text-gray-900 tracking-tight">PoolApp · Painel Admin</h1>
<p class="text-[13px] text-gray-500 mt-1">Acesso restrito ao administrador</p>
</div>

<form id="loginForm" novalidate>
<div class="field mb-3">
<span class="icon-left">
<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5.5A2.5 2.5 0 015.5 3h9A2.5 2.5 0 0117 5.5v9A2.5 2.5 0 0114.5 17h-9A2.5 2.5 0 013 14.5v-9z"/><path d="M3.5 5.5l6.5 4.5 6.5-4.5"/></svg>
</span>
<input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" value="admin@poolapp.com">
</div>

<div class="field mb-4">
<span class="icon-left">
<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="8" width="14" height="9" rx="2"/><path d="M7 8V6a3 3 0 016 0v2"/></svg>
</span>
<input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password">
<button type="button" class="eyeBtn" id="pwEye" tabindex="-1" aria-label="Mostrar senha">
<svg id="eyeOn" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 10s2.5-5 7.5-5 7.5 5 7.5 5-2.5 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.2"/></svg>
<svg id="eyeOff" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><path d="M3 3l14 14"/><path d="M10.6 10.6A2 2 0 019 10a2 2 0 01.6-1.4"/><path d="M10 5c5 0 7.5 5 7.5 5a11.5 11.5 0 01-2.2 2.8M10 15c-5 0-7.5-5-7.5-5A11.5 11.5 0 015.7 7.2"/></svg>
</button>
</div>

<label class="flex items-center gap-2 text-[13px] text-gray-600 mb-5 select-none"><input type="checkbox" id="lembrar" checked class="w-4 h-4 accent-[#0F5C5C] rounded"> Lembrar de mim</label>

<button type="submit" class="btn" id="btnLogin">Entrar</button>
<p id="msg" class="hidden mt-3 text-[12px] font-semibold text-red-600 text-center"></p>
</form>

<div class="mt-6 pt-5 border-t border-gray-100 text-center">
<a href="/admin/forgot.html" class="text-[12px] font-semibold text-[#0F5C5C] hover:underline">Esqueceu a senha?</a>
</div>
</div>
<p class="text-center text-[11px] text-gray-400 mt-4">PoolApp Universal · Área restrita</p>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
function tokenStore(t,l){if(l)localStorage.setItem('pa_token',t);else sessionStorage.setItem('pa_token',t);}
async function api(p,o){try{const r=await fetch(p,o);if(r.status!==404)return r;}catch(e){}return fetch(p+'.js',o);}

const eyeBtn=$('#pwEye'), inp=$('#loginSenha'), eyeOn=$('#eyeOn'), eyeOff=$('#eyeOff');
eyeBtn.addEventListener('click',()=>{
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  eyeOn.style.display=show?'none':'block';
  eyeOff.style.display=show?'block':'none';
});

$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const email=$('#loginEmail').value.trim(),senha=inp.value;
 if(!email||!senha){$('#msg').textContent='Preencha e-mail e senha';$('#msg').classList.remove('hidden');return;}
 const btn=$('#btnLogin');btn.disabled=true;btn.textContent='Entrando...';$('#msg').classList.add('hidden');
 try{
  const r=await api('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
  const j=await r.json();
  if(!r.ok||!j.ok){$('#msg').textContent=j.error||'E-mail ou senha incorretos';$('#msg').classList.remove('hidden');return;}
  tokenStore(j.token,$('#lembrar').checked);
  location.href='/admin.html';
 }catch(err){$('#msg').textContent='Erro de conexão com API';$('#msg').classList.remove('hidden');}
 finally{btn.disabled=false;btn.textContent='Entrar';}
});
</script>
</body>
</html>
